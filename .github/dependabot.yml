version: 2

registries:
  github-packages:
    type: nuget-feed
    url: https://nuget.pkg.github.com/rafalczajka/index.json
    username: rafalczajka
    password: ${{secrets.DEPENDABOT_GITHUB_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: nuget
    directory: /api
    registries:
      - github-packages
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    exclude-paths:
      - legacy/**
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      npm:
        patterns:
          - '*'

  # Legacy apps

  - package-ecosystem: npm
    directory: /legacy/app-mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'

  - package-ecosystem: pip
    directories:
      - /legacy/app-cli
      - /legacy/app-cli/generated_client
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
