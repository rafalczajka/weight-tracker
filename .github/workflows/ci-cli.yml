name: CI - CLI

on:
  push:
    branches:
      - main
    paths:
      - app-cli/**
      - api/**/openapi.json
      - .github/workflows/ci-cli.yml

  pull_request:
    paths:
      - app-cli/**
      - api/**/openapi.json
      - .github/workflows/ci-cli.yml

  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            app-cli/requirements.txt
            app-cli/requirements-tools.txt
            app-cli/generated_client/pyproject.toml

      - name: Create virtual environments
        run: |
          python -m venv app-cli/.venv
          python -m venv app-cli/.venv-tools

      - name: Install CLI dependencies
        working-directory: app-cli
        run: ./.venv/bin/python -m pip install -r requirements.txt

      - name: Install tool dependencies
        working-directory: app-cli
        run: ./.venv-tools/bin/python -m pip install -r requirements-tools.txt

      - name: Check installed dependencies
        working-directory: app-cli
        run: |
          ./.venv/bin/python -m pip check
          ./.venv-tools/bin/python -m pip check

      - name: Lint and format check
        working-directory: app-cli
        run: |
          ./.venv-tools/bin/python -m ruff check .
          ./.venv-tools/bin/python -m ruff format --check .

      - name: Smoke test CLI
        working-directory: app-cli
        run: ./.venv/bin/python -m wtrack --help
