name: CI - Mobile

on:
  push:
    branches:
      - main
    paths:
      - app-mobile/**
      - .github/workflows/ci-mobile.yml

  pull_request:
    paths:
      - app-mobile/**
      - .github/workflows/ci-mobile.yml

  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json

      - name: Create configuration
        working-directory: app-mobile
        run: cp config.template.json config.json

      - name: Install dependencies
        working-directory: app-mobile
        run: npm ci

      - name: Lint
        working-directory: app-mobile
        run: npm run lint

      - name: Check types
        working-directory: app-mobile
        run: npm run typecheck

      - name: Test
        working-directory: app-mobile
        run: npm test -- --runInBand

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build Android debug application
        working-directory: app-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug --no-daemon
